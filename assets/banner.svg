<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Vision Inspect Agent banner">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1B33"/>
      <stop offset="1" stop-color="#102542"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#ink)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- monogram circles (brand-identity lockup motif) -->
  <circle cx="1088" cy="160" r="86" fill="#16314F"/>
  <circle cx="1088" cy="160" r="86" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>
  <circle cx="1166" cy="210" r="46" fill="#1454FE"/>
  <text x="1088" y="184" font-family="'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif" font-size="68" font-weight="700" fill="#EDF1F7" text-anchor="middle">V</text>
  <text x="1166" y="222" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">ll3i</text>

  <!-- accent bar -->
  <rect x="72" y="82" width="4" height="34" rx="2" fill="#1454FE"/>

  <!-- eyebrow label: mono, letterspaced (ls-label) -->
  <text x="92" y="106" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" letter-spacing="3.2" fill="#CADBFF">AI AGENT · VISION</text>

  <!-- title with wordmark blue dot -->
  <text x="72" y="182" font-family="'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif" font-size="56" font-weight="800" letter-spacing="-1" fill="#EDF1F7">Vision Inspect Agent<tspan fill="#3B7AFF">.</tspan></text>

  <!-- tagline -->
  <text x="72" y="226" font-family="'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif" font-size="21" font-weight="500" fill="#EDF1F7" opacity="0.78">스스로 검증하는 멀티모달 외관검사 에이전트</text>

  <!-- footer: mono data line -->
  <line x1="72" y1="256" x2="560" y2="256" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1"/>
  <text x="72" y="284" font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="13" letter-spacing="1.5" fill="#94A0B0">github.com/ll3i/AI_AGENT</text>
</svg>
